; =====================================================================
;  platformio.ini — Waveshare ESP32-S3-Touch-LCD-7
;  ----------------------------------------------------------------------
;  Build environments for the Waveshare ESP32-S3-Touch-LCD-7 board
;  (RGB 800×480, GT911 touch, CH422G expander, SD, TWAI, ADC, UART2).
;
;    pio run                          # builds the default environment
;    pio run -e release               # smaller, LVGL optimised build
;    pio run -e debug                 # verbose logging, LVGL asserts on
;    pio run -e nodisplay             # board only — no LCD / no touch
;    pio run -t upload                # builds + uploads
;    pio run -t upload -e release     # upload the release variant
;    pio device monitor               # serial console @ 115200 baud
;
;  The driver library under include/waveshare_driver/ is **header-only**
;  and consumed via the `build_flags = -I include` entry below.
;
;  Hardware targets:
;    * ESP32-S3-WROOM-1 (Xtensa LX7, dual core, 240 MHz)
;    * 512 KB on-chip SRAM, 16 KB RTC SRAM
;    * 8 MB external PSRAM (qio, OPI)
;    * 16 MB Quad SPI flash (qio, 80 MHz DTR)
;    * 800×480 RGB-LCD via 16-bit parallel bus + ST7262 panel
;    * GT911 capacitive touch on the shared I2C bus (SDA=8, SCL=9)
;    * CH422G I/O expander at 0x24/0x38 for backlight / touch-RST /
;      USB↔CAN muxing
; =====================================================================

[platformio]
default_envs      = devkitc-1
src_dir           = src
build_dir         = .pio/build
lib_dir           = .pio/libdeps
data_dir          = .pio/data
cache_dir         = .pio/cache
monitor_echo      = yes
monitor_filters   = colorize, time, log2file

[env:devkitc-1]
platform                       = https://github.com/pioarduino/platform-espressif32.git
board                          = esp32-s3-devkitc-1
board_build.mcu                = esp32s3
board_build.f_cpu              = 240000000L
board_build.f_flash            = 80000000L
board_build.flash_mode         = qio
board_build.flash_size         = 16MB
board_build.psram_size         = 8MB
board_build.psram_type         = qio
board_build.arduino.memory_type = qio_opi
board_build.arduino.library_encoder = default
board_build.partitions         = min_spiffs.csv
framework                      = arduino

; ---------------------------------------------------------------
;  Toolchain / compiler flags
; ---------------------------------------------------------------
monitor_speed      = 115200
build_unflags      =
    -std=gnu++11
build_flags        =
    -D LV_CONF_INCLUDE_SIMPLE                ; use include/lv_conf.h
    -I include                               ; exposes waveshare_driver/
    -DBOARD_HAS_PSRAM                        ; ESP-IDF feature flag
    -DBOARD_HAS_16MB_FLASH                   ; matches the 16 MB module
    -DARDUINO_USB_CDC_ON_BOOT=1             ; keep CDC after reset
    -DCORE_DEBUG_LEVEL=3                     ; core debug verbosity
    -DESP32S3_DEFAULT_PLATFORM
    -D CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1 ; document 240 MHz target
    -D CONFIG_SPIRAM_USE=1                   ; request PSRAM at link time
    -D CONFIG_SPIRAM_TYPE_AUTO=1
    -D CONFIG_SPIRAM_SPEED_80M=1
    -D CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1
    -D LCD_RGB_ELEMENT_ORDER_RGB=ESP_LCD_COLOR_SPACE_RGB
    -D LCD_RGB_ELEMENT_ORDER_BGR=ESP_LCD_COLOR_SPACE_BGR
    -std=gnu++17

lib_deps =
    lvgl/lvgl@^9.5.0
    SD

src_filter        =
    +<main.cpp>

; ---------------------------------------------------------------
;  Upload & monitor
; ---------------------------------------------------------------
upload_speed      = 921600
upload_protocol   = esptool
upload_flags      =
    --before=default_reset
    --after=hard_reset
    --chip=esp32s3

[env:release]
extends           = env:devkitc-1
build_type        = release
optimization      = -Os
build_flags        =
    ${env:devkitc-1.build_flags}
    -DLV_USE_LOG=0
    -DLV_USE_ASSERT_NULL=0
    -DLV_USE_ASSERT_MALLOC=0
    -DLV_USE_THEME_DEFAULT=0
    -DLV_USE_OBSERVER=0
    -DLV_USE_DEMO_WIDGETS=0
    -DLV_USE_DEMO_BENCHMARK=0
    -DLV_USE_DEMO_MUSIC=0
    -DLV_USE_DEMO_KEYPAD_AND_ENCODER=0
    -DLV_USE_DEMO_STRESS=0


[env:nodisplay]
extends           = env:devkitc-1
build_flags        =
    ${env:devkitc-1.build_flags}
    -DWAVESHARE_DRIVER_SKIP_LCD
    -DWAVESHARE_DRIVER_SKIP_TOUCH